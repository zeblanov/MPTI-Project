<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Produk - Forest Dessert</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <input type="checkbox" id="nav-toggle" class="nav-toggle"/>
    <div class="navbar-content">
      <img src="assets/img/logo.jpg" alt="Logo" class="logo" />
      <span class="web-name">FOREST DESSERT</span>
      <label for="nav-toggle" class="burger">&#9776;</label>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="produk.html" class="active">Produk</a></li>
        <li><a href="edukasi.html">Edukasi Gizi</a></li>
        <li><a href="pemesanan.html">Pemesanan</a></li>
        <li><a href="lokasi.html">Lokasi</a></li>
        <li><a href="kontak.html">Kontak</a></li>
      </ul>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main>
    <section class="container">
      <h2 class="section-title">Menu Lengkap</h2>
      <div id="productGrid" class="product-grid"></div>
    </section>
  </main>

  <footer>
    &copy; 2025 Forest Dessert — Health Companion
  </footer>

  <script>
    // --- DATA PRODUK ---
    const PRODUCTS = [
      {id:1,name:'Choco Forest Cake',image:'assets/img/Choco Forest Cake.jpg',short:'Cokelat lembut + topping sehat',desc:'Cake lembut dengan rasa cokelat pekat dan topping buah rendah gula.',nutrition:'Protein 5g · Gula 12g · Karbohidrat 30g',price:'Rp35.000'},
      {id:2,name:'Fruit Delight',image:'assets/img/Fruit Delight.jpg',short:'Campuran buah segar dan yoghurt',desc:'Dessert segar dari potongan buah tropis dan yoghurt rendah lemak.',nutrition:'Protein 3g · Gula 10g',price:'Rp30.000'},
      {id:3,name:'Matcha Pudding',image:'assets/img/Pudding Matcha.jpg',short:'Matcha lembut kaya antioksidan',desc:'Puding hijau matcha dengan rasa lembut dan manfaat antioksidan tinggi.',nutrition:'Protein 6g · Gula 8g',price:'Rp32.000'},
      {id:4,name:'Berry Yogurt Parfait',image:'assets/img/pudingcoklat.png',short:'Lapisan yogurt dan buah berry',desc:'Kombinasi segar antara yoghurt, madu alami, dan buah berry yang kaya serat.',nutrition:'Protein 4g · Gula 9g',price:'Rp33.000'},
      {id:5,name:'Tropical Oat Bowl',image:'assets/img/pudingstrawberry.png',short:'Oat lembut dengan topping buah tropis',desc:'Oatmeal lembut disajikan dengan pisang, kiwi, dan kelapa parut.',nutrition:'Protein 5g · Gula 7g · Serat 6g',price:'Rp29.000'},
      {id:6,name:'Avocado Choco Bliss',image:'assets/img/pudingalpukat.png',short:'Avokad dan cokelat — kombinasi creamy sehat',desc:'Smoothie dessert perpaduan alpukat segar dan cokelat rendah gula.',nutrition:'Protein 6g · Gula 10g · Lemak sehat 8g',price:'Rp31.000'}
    ];

    // --- RENDER PRODUK ---
    const grid = document.getElementById("productGrid");
    grid.innerHTML = PRODUCTS.map(p => `
      <div class="card">
        <img src="${p.image}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p class="price">${p.price}</p>
        <p>${p.short}</p>
        <div class="buttons">
          <button onclick="showDetail(${p.id})" class="btn detail">Detail</button>
          <a href="pemesanan.html?produk=${encodeURIComponent(p.name)}" class="btn order">Order</a>
        </div>
      </div>
    `).join('');

    // --- POPUP DETAIL PRODUK ---
    function showDetail(id) {
      const p = PRODUCTS.find(x => x.id === id);
      document.getElementById("modalImg").src = p.image;
      document.getElementById("modalTitle").innerText = p.name;
      document.getElementById("modalDesc").innerText = p.desc;
      document.getElementById("modalNutrition").innerText = p.nutrition;
      document.getElementById("modalPrice").innerText = p.price;
      document.getElementById("modalForm").href = "pemesanan.html?produk=" + encodeURIComponent(p.name);
      document.getElementById("productModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("productModal").style.display = "none";
    }
  </script>

  <!-- POPUP DETAIL PRODUK -->
  <div id="productModal" class="modal" onclick="closeModal()">
    <div class="dialog" onclick="event.stopPropagation()">
      <div class="left"><img id="modalImg" src="" alt="product"></div>
      <div class="right">
        <h2 id="modalTitle"></h2>
        <p id="modalDesc" style="color:#5a4a4a"></p>
        <p><strong>Nutrition:</strong> <span id="modalNutrition"></span></p>
        <p style="font-size:1.2rem;color:#267373" id="modalPrice"></p>
        <div style="display:flex;gap:10px;margin-top:12px">
          <!-- Hanya 1 tombol: Form Pemesanan -->
          <a id="modalForm" class="btn secondary" href="pemesanan.html" target="_blank">Form Pemesanan</a>
        </div>
      </div>
    </div>
  </div>

  <style>
    .btn {
      background:#267373;
      color:white;
      padding:8px 16px;
      border-radius:8px;
      text-decoration:none;
      transition:0.3s;
      border:none;
      cursor:pointer;
    }
    .btn:hover { background:#1e5d5d; }

    .btn.detail {
      background:#d1b67a; /* awalnya kuning */
      color:#fff;
    }
    .btn.detail:hover {
      background:#fff; /* hover jadi putih */
      color:#d1b67a;
      border:1px solid #d1b67a;
    }

    .btn.order {
      background:#267373;
      color:#fff;
    }

    /* Saat hover ke seluruh card atau gambar */
    .card:hover .btn.order {
      background:#d1b67a;
      color:#fff;
    }

    .product-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
      gap:20px;
      margin-top:20px;
    }
    .card {
      background:#fff;
      padding:15px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
      transition:transform 0.3s;
    }
    .card:hover {
      transform:translateY(-5px);
    }
    .card img {width:100%;border-radius:8px;}
    .buttons {display:flex;justify-content:space-between;margin-top:10px;}
    .modal {
      position:fixed;
      top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.6);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:1000;
    }
    .dialog {
      background:#fff;
      padding:20px;
      border-radius:12px;
      display:flex;
      gap:20px;
      max-width:700px;
      width:90%;
    }
    .dialog img {width:250px;border-radius:8px;}
    .dialog .right {flex:1;}
  </style>
</body>
</html>
